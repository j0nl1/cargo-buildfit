[package]
name = "cargo-buildfit"
version = "0.1.0"
edition = "2024"
description = "Consumer-aware Cargo build admission and artifact retention"
license = "MIT"
repository = "https://github.com/j0nl1/cargo-buildfit"

[package.metadata.buildfit]
quota-gib = 250
low-water-percent = 80
reserve-gib = 150
stop-below-gib = 30
build-headroom-gib = 1
min-age-seconds = 3600
check-interval-seconds = 300
worktrees = true
line-tables-only = true

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_Memory", "Win32_UI_Shell"] }
